<!doctype html>
<!-- Source for assets/img/og.png, the 1200x630 link-preview image for the
     Pooled pages. Rebuild with headless Chrome; see the root README. -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../assets/css/fonts.css">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#F5F4EF;font-family:'Plus Jakarta Sans',sans-serif;color:#1A1B16}
  .wrap{position:absolute;inset:0;padding:70px 84px 64px;display:flex;flex-direction:column}
  .lock{display:flex;align-items:center;gap:18px}
  .lock svg{width:72px;height:72px}
  .word{font-family:'Space Grotesk';font-weight:700;font-size:48px;letter-spacing:-1.5px}
  h1{font-family:'Space Grotesk';font-weight:700;font-size:66px;line-height:1.02;letter-spacing:-2.6px;margin:44px 0 0;max-width:640px}
  p{font-size:24px;color:#6C6E63;margin:20px 0 0;max-width:600px;line-height:1.4}
  .pills{display:flex;gap:10px;margin-top:auto}
  .pill{background:#fff;border:1px solid #E3E1D8;border-radius:999px;padding:10px 18px;font-size:19px;font-weight:600;color:#3D7F5C}
  .phone{position:absolute;right:70px;top:48px;width:300px;transform:rotate(4deg);filter:drop-shadow(0 30px 50px rgba(26,27,22,.22))}
  .glow{position:absolute;right:-60px;top:-60px;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,#E6F7BE 0%,rgba(230,247,190,0) 70%)}
</style></head><body>
<div class="glow"></div>
<img class="phone" src="../assets/img/landing-hero-phone-center.webp" alt="">
<div class="wrap">
  <div class="lock">
    <svg viewBox="0 0 320 320"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A2C22"/><stop offset="1" stop-color="#0D0E09"/></linearGradient></defs><rect width="320" height="320" rx="72" fill="url(#g)"/><rect x="100" y="78" width="120" height="96" rx="22" fill="#C9BCFF"/><rect x="64" y="112" width="192" height="130" rx="34" fill="#CBF264"/><rect x="196" y="159" width="48" height="36" rx="12" fill="#1A1B16"/></svg>
    <span class="word">Pooled</span>
  </div>
  <h1>Shared expense tracker for Android</h1>
  <p>Track spending, share a space with the people you live with, and see what everyone has left.</p>
  <div class="pills"><span class="pill">Free</span><span class="pill">No ads</span><span class="pill">No account needed</span></div>
</div>
</body></html>
