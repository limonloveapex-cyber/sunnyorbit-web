<!--
  Pooled — a SunnyOrbit product.

  Six static pages, no framework, no build output beyond plain HTML. Nothing
  on this site is fetched from a third party: the fonts are self-hosted in
  assets/fonts and there is no script, no CDN, no analytics and no tracking
  pixel anywhere in the repository. The app's whole pitch is that it does not
  watch you; a marketing site that loaded a tracker to say so would be the
  advertisement for the opposite.

  Every claim on these pages was checked against the shipped code before it
  was written — see hosting/notes/website-and-policy-brief.md in the app repo.
  If a feature described here stops being true, delete the line. Do not soften
  it.

  Edit src/ and run `node tools/build.js`; this file is generated.
-->
